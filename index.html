<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مجلس الحبايب - لوحة المتابعة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<!-- SheetJS for reading Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --surface2:  #1e2530;
    --border:    #2a3441;
    --gold:      #c9a84c;
    --gold-dim:  #8a6f2e;
    --gold-glow: rgba(201,168,76,0.15);
    --green:     #2ea44f;
    --green-bg:  rgba(46,164,79,0.12);
    --red:       #f85149;
    --red-bg:    rgba(248,81,73,0.12);
    --text:      #e6edf3;
    --muted:     #7d8590;
    --teal:      #39c5cf;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
  }

  /* ── Loading screen ─────────────────────── */
  #loading-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 9999;
  }

  .spinner {
    width: 48px; height: 48px;
    border: 4px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #loading-screen p {
    color: var(--muted);
    font-size: 14px;
  }

  #loading-screen .load-title {
    color: var(--gold);
    font-size: 20px;
    font-weight: 700;
  }

  /* ── Error banner ────────────────────────── */
  #error-banner {
    display: none;
    background: var(--red-bg);
    border: 1px solid var(--red);
    border-radius: 10px;
    padding: 16px 20px;
    margin: 20px 32px;
    color: var(--red);
    font-size: 14px;
  }

  /* ── Header ─────────────────────────────── */
  .header {
    background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1a1506 100%);
    border-bottom: 1px solid var(--gold-dim);
    padding: 28px 32px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 16px;
  }

  .header-title {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-icon {
    width: 52px; height: 52px;
    background: radial-gradient(circle at 30% 30%, var(--gold), var(--gold-dim));
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    box-shadow: 0 0 20px var(--gold-glow);
    flex-shrink: 0;
  }

  .header h1 {
    font-size: 26px;
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 0.5px;
    line-height: 1.1;
  }

  .header .subtitle {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    flex-shrink: 0;
  }

  .balance-badge {
    background: var(--green-bg);
    border: 1px solid var(--green);
    border-radius: 12px;
    padding: 10px 20px;
    text-align: center;
  }

  .balance-badge .label { font-size: 11px; color: var(--muted); }
  .balance-badge .amount { font-size: 22px; font-weight: 700; color: var(--green); direction: ltr; }

  .last-update {
    font-size: 11px;
    color: var(--muted);
    text-align: left;
  }

  /* ── Tabs ────────────────────────────────── */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 16px 32px 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    overflow-x: auto;
  }

  .tab {
    padding: 10px 22px;
    border-radius: 8px 8px 0 0;
    border: 1px solid transparent;
    border-bottom: none;
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    color: var(--muted);
    background: transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .tab:hover { color: var(--text); background: var(--surface2); }

  .tab.active {
    background: var(--bg);
    color: var(--gold);
    border-color: var(--border);
    border-bottom-color: var(--bg);
    margin-bottom: -1px;
  }

  /* ── Main content ────────────────────────── */
  .main { padding: 28px 32px; max-width: 1200px; margin: 0 auto; }

  .panel { display: none; }
  .panel.active { display: block; }

  /* ── Summary cards ───────────────────────── */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }

  .card .card-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .card .card-value { font-size: 24px; font-weight: 700; color: var(--text); direction: ltr; }
  .card .card-value.gold { color: var(--gold); }
  .card .card-value.green { color: var(--green); }
  .card .card-value.red { color: var(--red); }
  .card .card-value.teal { color: var(--teal); }

  /* ── Member lookup ───────────────────────── */
  .lookup-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 28px;
  }

  .lookup-box h3 {
    font-size: 15px;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 16px;
  }

  .lookup-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  select, .filter-btn {
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
  }

  select { flex: 1; min-width: 180px; }
  select:focus { outline: 1px solid var(--gold); border-color: var(--gold); }

  .filter-btn {
    background: var(--gold-glow);
    border-color: var(--gold-dim);
    color: var(--gold);
    font-weight: 600;
    padding: 10px 20px;
    transition: background 0.2s;
  }

  .filter-btn:hover { background: rgba(201,168,76,0.25); }

  /* ── Member status result ────────────────── */
  .member-result {
    margin-top: 20px;
    display: none;
  }

  .member-result.show { display: block; }

  .member-name-banner {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .months-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
  }

  .month-card {
    border-radius: 10px;
    padding: 12px 14px;
    border: 1px solid;
    text-align: center;
  }

  .month-card.paid {
    background: var(--green-bg);
    border-color: var(--green);
  }

  .month-card.unpaid {
    background: var(--red-bg);
    border-color: var(--red);
  }

  .month-card .m-name { font-size: 13px; font-weight: 600; }
  .month-card.paid .m-name { color: var(--green); }
  .month-card.unpaid .m-name { color: var(--red); }

  .month-card .m-amount { font-size: 18px; font-weight: 700; margin: 4px 0; direction: ltr; }
  .month-card.paid .m-amount { color: var(--text); }
  .month-card.unpaid .m-amount { color: var(--muted); }

  .month-card .m-status { font-size: 11px; }
  .month-card.paid .m-status { color: var(--green); }
  .month-card.unpaid .m-status { color: var(--red); }

  /* ── Full payments table ─────────────────── */
  .section-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    overflow-x: auto;
  }

  table { width: 100%; border-collapse: collapse; min-width: 580px; }
  thead { background: var(--surface2); }
  th {
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-align: right;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 11px 16px;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.025); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
  }

  .badge.paid { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
  .badge.unpaid { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }

  /* ── Month filter pills ──────────────────── */
  .pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .pill {
    font-family: 'Tajawal', sans-serif;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .pill:hover, .pill.active {
    border-color: var(--gold-dim);
    background: var(--gold-glow);
    color: var(--gold);
  }

  /* ── Expenses ────────────────────────────── */
  .expense-row td:last-child { direction: ltr; text-align: left; }

  .amount-in { color: var(--green); font-weight: 600; }
  .amount-out { color: var(--red); }

  .running-balance { font-size: 12px; color: var(--muted); }

  /* ── Progress bar ────────────────────────── */
  .progress-wrap { margin-top: 6px; }
  .progress-bar {
    height: 5px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    border-radius: 3px;
    transition: width 0.6s ease;
  }

  /* ── Month summary ───────────────────────── */
  .month-summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }

  .month-summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }

  .month-summary-card h4 {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .month-summary-card .ms-amount {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    direction: ltr;
    margin-bottom: 8px;
  }

  .ms-meta { font-size: 12px; color: var(--muted); }

  /* ── Responsive ──────────────────────────── */
  @media (max-width: 640px) {
    .header { padding: 16px; }
    .header h1 { font-size: 20px; }
    .tabs { padding: 12px 16px 0; }
    .main { padding: 20px 16px; }
    .balance-badge .amount { font-size: 18px; }
  }
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loading-screen">
  <div class="spinner"></div>

</div>

<!-- ERROR BANNER -->
<div id="error-banner"></div>

<!-- HEADER -->
<div class="header">
  <div class="header-title">
    <div class="logo-icon">☕</div>
    <div>
      <h1>مجلس الحبايب</h1>
      <div class="subtitle">لوحة متابعة الاشتراكات والمصروفات</div>
    </div>

  <div class="header-right">

<div id="tab-member" class="panel active">

    <div class="lookup-row">
      <select id="member-select">
        <option value="">— اختر اسمك —</option>
      </select>

    </div>
    <div class="member-result" id="member-result">
      <div class="member-name-banner" id="member-banner"></div>

    </div>

</div>

<!-- ════════════════════════════════════════ -->
<!-- TAB 2: ALL PAYMENTS                     -->
<!-- ════════════════════════════════════════ -->
<div id="tab-payments" class="panel">

  <div class="section-title">📋 جدول الاشتراكات الشهرية</div>

  <div class="pills" id="month-pills"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>الشهر</th>

  <div class="cards" id="expense-cards"></div>

  <div class="month-summary-grid" id="month-summary-grid"></div>

  <div class="section-title">💸 تفاصيل المصروفات</div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>الوصف</th>
          <th>النوع</th>
          <th>المبلغ (ر.س)</th>
          <th>الرصيد بعد العملية</th>
        </tr>
      </thead>
      <tbody id="expenses-tbody"></tbody>
    </table>
  </div>

</div>
</div><!-- /main -->


<script>
// ──────────────────────────────────────────────────────────
// CONFIG
// ──────────────────────────────────────────────────────────
const EXCEL_URL = 'https://raw.githubusercontent.com/hussainalmoghalliq2024/majlis/main/Habayib%20Majlis%20Expenses%202026.xlsx';

// Month name lookup by Excel serial (first day of each Arabic month 2026)
const MONTH_MAP = {
  46023: 'يناير', 46054: 'فبراير', 46082: 'مارس',
  46113: 'أبريل', 46143: 'مايو',   46174: 'يونيو',
  46204: 'يوليو', 46235: 'أغسطس', 46266: 'سبتمبر',
  46296: 'أكتوبر',46327: 'نوفمبر',46357: 'ديسمبر'
};

const MONTH_ORDER = Object.keys(MONTH_MAP).map(Number);

// Month name → serial (reverse lookup)
const MONTH_NAME_TO_SERIAL = {};
Object.entries(MONTH_MAP).forEach(([k,v]) => { MONTH_NAME_TO_SERIAL[v] = parseInt(k); });

// ──────────────────────────────────────────────────────────
// UTILITIES
// ──────────────────────────────────────────────────────────

/**
 * Convert Excel serial date to readable Arabic date string
 * without using JavaScript Date objects (avoids timezone offset bugs).
 */
function excelSerialToDateStr(serial) {
  const n = parseInt(serial);
  if (!n || isNaN(n) || n < 1) return '—';

  // Excel epoch: day 1 = Jan 1, 1900 (with leap-year bug: serial 60 = Feb 29 1900 which didn't exist)
  // Adjust: serial 1 = 1900-01-01
  let s = n;
  if (s > 59) s--; // skip the phantom Feb 29 1900

  // Days since 1899-12-31
  // We compute year/month/day using pure arithmetic
  let z = s + 693595; // shift to proleptic Gregorian epoch (days since March 1, year 0)
  let h = 100 * z - 25;
  let a = Math.floor(h / 3652425);
  let b = a - Math.floor(a / 4);
  let year  = Math.floor((100 * b + h) / 36525);
  let c = b + z - Math.floor(36525 * year / 100);
  let month = Math.floor((5 * c + 456) / 153);
  let day   = c - Math.floor((153 * month - 457) / 5);
  if (month > 12) { month -= 12; year++; }

  const monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو',
                      'يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return `${day} ${monthNames[month-1]} ${year}`;
}

/**
 * Find the closest month serial for a given payment date serial.
 * Returns the MONTH_MAP key whose value is the same calendar month.
 */
function getMonthSerial(dateSerial) {
  if (!dateSerial || isNaN(dateSerial)) return null;
  const n = parseInt(dateSerial);
  // Convert to approximate year+month using the same arithmetic
  let s = n > 59 ? n - 1 : n;
  let z = s + 693595;
  let h = 100 * z - 25;
  let a = Math.floor(h / 3652425);
  let b = a - Math.floor(a / 4);
  let year  = Math.floor((100 * b + h) / 36525);
  let c = b + z - Math.floor(36525 * year / 100);
  let month = Math.floor((5 * c + 456) / 153);
  if (month > 12) { month -= 12; year++; }

  // Map (year, month) → our MONTH_ORDER serials
  // All our months are in 2026 except يناير through ديسمبر
  // Match by finding which MONTH_MAP serial has same year+month
  for (const ms of MONTH_ORDER) {
    let s2 = ms > 59 ? ms - 1 : ms;
    let z2 = s2 + 693595;
    let h2 = 100 * z2 - 25;
    let a2 = Math.floor(h2 / 3652425);
    let b2 = a2 - Math.floor(a2 / 4);
    let year2  = Math.floor((100 * b2 + h2) / 36525);
    let c2 = b2 + z2 - Math.floor(36525 * year2 / 100);
    let month2 = Math.floor((5 * c2 + 456) / 153);
    if (month2 > 12) { month2 -= 12; year2++; }
    if (year2 === year && month2 === month) return ms;
  }
  return null;
}

// ──────────────────────────────────────────────────────────
// STATE
// ──────────────────────────────────────────────────────────
let payments = [];
let expenses = [];
let members  = [];

// ──────────────────────────────────────────────────────────
// EXCEL PARSER
// ──────────────────────────────────────────────────────────
/**
 * Parse the workbook. Expected sheets:
 *   Individual_Payments  — columns: Month, No, Name, Amount, Paid (TRUE/FALSE), Date
 *   General_Expenses     — columns: Description, Amount  (positive=income, negative=expense)
 */
function parseWorkbook(wb) {
  const errors = [];

  // ── Individual_Payments sheet ─────────────────────────
  const wsP = wb.Sheets['Individual_Payments'];
  if (!wsP) errors.push('لم يتم إيجاد شيت Individual_Payments');
  else {
    const rows = XLSX.utils.sheet_to_json(wsP, { header: 1, defval: '' });
    // Find header row (first row with content)
    let headerIdx = 0;
    for (let i = 0; i < rows.length; i++) {
      if (rows[i].some(c => String(c).trim().length > 0)) { headerIdx = i; break; }
    }
    const headers = rows[headerIdx].map(h => String(h).trim().toLowerCase());

    // Column index helpers
    const ci = (names) => {
      for (const n of names) {
        const idx = headers.findIndex(h => h.includes(n));
        if (idx !== -1) return idx;
      }
      return -1;
    };

    const col = {
      month:  ci(['month','الشهر']),
      no:     ci(['no','رقم','#']),
      name:   ci(['name','الاسم','اسم']),
      amount: ci(['amount','المبلغ','مبلغ']),
      paid:   ci(['paid','مدفوع','الحالة','status']),
      date:   ci(['date','تاريخ']),
    };

    for (let i = headerIdx + 1; i < rows.length; i++) {
      const row = rows[i];
      if (!row || row.every(c => c === '' || c === null || c === undefined)) continue;

      const rawMonth  = row[col.month];
      const rawName   = col.name  !== -1 ? String(row[col.name] || '').trim()  : '';
      const rawAmount = col.amount !== -1 ? parseFloat(row[col.amount]) || 0    : 0;
      const rawPaid   = col.paid  !== -1 ? row[col.paid]                        : '';
      const rawDate   = col.date  !== -1 ? row[col.date]                        : '';
      const rawNo     = col.no    !== -1 ? parseInt(row[col.no]) || (i - headerIdx) : (i - headerIdx);

      if (!rawName) continue;

      // Determine month serial
      let monthSerial = null;
      if (rawMonth !== '' && rawMonth !== null && rawMonth !== undefined) {
        const mn = parseInt(rawMonth);
        if (!isNaN(mn) && MONTH_MAP[mn]) {
          monthSerial = mn; // direct serial
        } else {
          // Try Arabic month name
          const ms = MONTH_ORDER.find(ms => MONTH_MAP[ms] === String(rawMonth).trim());
          if (ms) monthSerial = ms;
        }
      }
      // Fallback: derive from payment date
      if (!monthSerial && rawDate) {
        const ds = parseInt(rawDate);
        if (!isNaN(ds)) monthSerial = getMonthSerial(ds);
      }
      if (!monthSerial) continue; // skip rows we can't assign a month to

      // Determine paid status
      let paid = false;
      if (typeof rawPaid === 'boolean') paid = rawPaid;
      else if (typeof rawPaid === 'number') paid = rawPaid !== 0;
      else {
        const ps = String(rawPaid).trim().toLowerCase();
        paid = ps === 'true' || ps === '1' || ps === 'yes' || ps === 'مدفوع' || ps === 'نعم';
      }

      // Date serial
      const dateSerial = rawDate !== '' ? parseInt(rawDate) : null;

      payments.push({
        month:  monthSerial,
        no:     rawNo,
        name:   rawName,
        amount: rawAmount,
        paid:   paid,
        date:   dateSerial && !isNaN(dateSerial) ? dateSerial : null,
      });
    }
  }

  // ── General_Expenses sheet ────────────────────────────
  const wsE = wb.Sheets['General_Expenses'];
  if (!wsE) errors.push('لم يتم إيجاد شيت General_Expenses');
  else {
    const rows = XLSX.utils.sheet_to_json(wsE, { header: 1, defval: '' });
    let headerIdx = 0;
    for (let i = 0; i < rows.length; i++) {
      if (rows[i].some(c => String(c).trim().length > 0)) { headerIdx = i; break; }
    }
    const headers = rows[headerIdx].map(h => String(h).trim().toLowerCase());

    const descIdx   = headers.findIndex(h => h.includes('desc') || h.includes('وصف') || h.includes('بيان'));
    const amountIdx = headers.findIndex(h => h.includes('amount') || h.includes('مبلغ'));

    for (let i = headerIdx + 1; i < rows.length; i++) {
      const row = rows[i];
      if (!row || row.every(c => c === '' || c === null || c === undefined)) continue;
      const desc   = descIdx   !== -1 ? String(row[descIdx] || '').trim()   : String(row[0] || '').trim();
      const amount = amountIdx !== -1 ? parseFloat(row[amountIdx]) || 0 : parseFloat(row[1]) || 0;
      if (!desc && amount === 0) continue;
      expenses.push({ desc, amount });
    }
  }

  if (errors.length) {
    showError('تحذير: ' + errors.join(' | '));
  }
}

// ──────────────────────────────────────────────────────────
// FETCH & INIT
// ──────────────────────────────────────────────────────────
async function loadData() {
  try {
    // Use a CORS proxy to fetch binary Excel file from GitHub
    // GitHub raw supports CORS for binary files directly
    const response = await fetch(EXCEL_URL);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const arrayBuffer = await response.arrayBuffer();
    const wb = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array', cellDates: false });
    parseWorkbook(wb);

    // Build unique sorted members list
    members = [...new Set(payments.map(p => p.name))].sort();

    // Show last update timestamp
    document.getElementById('last-update').textContent =
      'آخر تحديث: ' + new Date().toLocaleTimeString('ar-SA');

    // Render everything
    initUI();

    // Hide loading
    document.getElementById('loading-screen').style.display = 'none';

  } catch (err) {
    console.error(err);
    document.getElementById('loading-screen').style.display = 'none';
    showError('❌ تعذّر تحميل الملف من GitHub. تأكد من أن الملف موجود وعام (Public). الخطأ: ' + err.message);
  }
}

function showError(msg) {
  const el = document.getElementById('error-banner');
  el.textContent = msg;
  el.style.display = 'block';
}

// ──────────────────────────────────────────────────────────
// COMPUTED TOTALS (derived from loaded data)
// ──────────────────────────────────────────────────────────
function getStats() {
  const totalCollected = payments.filter(p=>p.paid).reduce((s,p)=>s+p.amount,0);
  const totalExpenses  = expenses.filter(e=>e.amount<0).reduce((s,e)=>s+Math.abs(e.amount),0);
  const balance        = expenses.reduce((s,e)=>s+e.amount,0);
  const paidCount      = payments.filter(p=>p.paid).length;
  const totalSlots     = payments.length;
  return { totalCollected, totalExpenses, balance, paidCount, totalSlots };
}

// ──────────────────────────────────────────────────────────
// TAB SWITCH
// ──────────────────────────────────────────────────────────
function showTab(id) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('btn-' + id).classList.add('active');
}

document.getElementById('btn-tab-member').addEventListener('click', () => showTab('tab-member'));
document.getElementById('btn-tab-payments').addEventListener('click', () => showTab('tab-payments'));
document.getElementById('btn-tab-expenses').addEventListener('click', () => showTab('tab-expenses'));

// ──────────────────────────────────────────────────────────
// RENDER HEADER BALANCE
// ──────────────────────────────────────────────────────────
function renderHeaderBalance() {
  const { balance } = getStats();
  document.getElementById('header-balance').textContent =
    balance.toLocaleString('ar', {minimumFractionDigits:2}) + ' ر.س';
}

// ──────────────────────────────────────────────────────────
// RENDER SUMMARY CARDS
// ──────────────────────────────────────────────────────────
function renderSummaryCards() {
  const { totalCollected, totalExpenses, balance, paidCount, totalSlots } = getStats();
  const pct = totalSlots > 0 ? Math.round(paidCount / totalSlots * 100) : 0;
  document.getElementById('summary-cards').innerHTML = `
    <div class="card">
      <div class="card-label">إجمالي المحصّل</div>
      <div class="card-value gold">${totalCollected.toLocaleString('ar')} ر.س</div>
      <div class="progress-wrap">
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px">${paidCount} من ${totalSlots} دفعة (${pct}%)</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-label">إجمالي المصروفات</div>
      <div class="card-value red">${totalExpenses.toLocaleString('ar',{minimumFractionDigits:2})} ر.س</div>
    </div>
    <div class="card">
      <div class="card-label">الرصيد المتاح</div>
      <div class="card-value green">${balance.toLocaleString('ar',{minimumFractionDigits:2})} ر.س</div>
    </div>
    <div class="card">
      <div class="card-label">عدد الأعضاء</div>
      <div class="card-value teal">${members.length}</div>
    </div>
  `;
}

// ──────────────────────────────────────────────────────────
// RENDER MEMBER SELECT
// ──────────────────────────────────────────────────────────
function renderMemberSelect() {
  const sel = document.getElementById('member-select');
  sel.innerHTML = '<option value="">— اختر اسمك —</option>';
  members.forEach(m => {
    const o = document.createElement('option');
    o.value = m; o.textContent = m;
    sel.appendChild(o);
  });
}

// ──────────────────────────────────────────────────────────
// SHOW MEMBER RESULT
// ──────────────────────────────────────────────────────────
function showMember() {
  const name = document.getElementById('member-select').value;
  if (!name) return;

  // Get all months and whether this member paid each month
  const memberPays = [];
  for (const ms of MONTH_ORDER) {
    const found = payments.find(p => p.name === name && p.month === ms);
    if (found) {
      memberPays.push(found);
    } else {
      // Check if any payments exist for this month at all (month may not have started)
      const monthHasData = payments.some(p => p.month === ms);
      if (monthHasData) {
        memberPays.push({ month: ms, no: 0, name, amount: 0, paid: false, date: null });
      }
    }
  }

  const totalPaid = memberPays.filter(p=>p.paid).reduce((s,p)=>s+p.amount,0);
  const pending   = memberPays.filter(p=>!p.paid).length;

  document.getElementById('member-banner').innerHTML =
    `<span>${name}</span>
     <span class="badge paid" style="font-size:13px">دفع ${totalPaid} ر.س</span>
     ${pending > 0 ? `<span class="badge unpaid">${pending} شهر متأخر</span>` : ''}`;

  const grid = document.getElementById('member-months');
  grid.innerHTML = memberPays.map(p => {
    const mName  = MONTH_MAP[p.month] || p.month;
    const dateStr = p.paid && p.date ? excelSerialToDateStr(p.date) : '';
    return `<div class="month-card ${p.paid ? 'paid' : 'unpaid'}">
      <div class="m-name">${mName}</div>
      <div class="m-amount">${p.paid ? p.amount + ' ر.س' : '—'}</div>
      <div class="m-status">${p.paid ? '✓ تم الدفع' : '✗ لم يتم الدفع'}</div>
      ${dateStr ? `<div style="font-size:10px;color:var(--muted);margin-top:5px">${dateStr}</div>` : ''}
    </div>`;
  }).join('');

  document.getElementById('member-result').classList.add('show');
}

document.getElementById('show-member-btn').addEventListener('click', showMember);

// ──────────────────────────────────────────────────────────
// RENDER PAYMENTS TABLE
// ──────────────────────────────────────────────────────────
function renderPaymentsTable(filter) {
  const data = filter === 'all' ? payments : payments.filter(p => p.month == filter);
  const tbody = document.getElementById('payments-tbody');
  tbody.innerHTML = data.map(p => {
    const mName   = MONTH_MAP[p.month] || p.month;
    const dateStr = p.paid && p.date ? excelSerialToDateStr(p.date) : '—';
    const badge   = p.paid
      ? '<span class="badge paid">✓ تم الدفع</span>'
      : '<span class="badge unpaid">✗ لم يتم الدفع</span>';
    return `<tr>
      <td>${mName}</td>
      <td style="color:var(--muted)">${p.no}</td>
      <td>${p.name}</td>
      <td style="direction:ltr;text-align:right">${p.paid ? p.amount + ' ر.س' : '—'}</td>
      <td>${badge}</td>
      <td style="font-size:12px;color:var(--muted)">${dateStr}</td>
    </tr>`;
  }).join('');
}

function renderMonthPills() {
  const pills = document.getElementById('month-pills');
  const activeMonths = [...new Set(payments.map(p => p.month))].sort((a,b)=>a-b);

  let html = `<button class="pill active" id="pill-all">الكل</button>`;
  activeMonths.forEach(m => {
    html += `<button class="pill" id="pill-${m}">${MONTH_MAP[m] || m}</button>`;
  });
  pills.innerHTML = html;

  document.getElementById('pill-all').addEventListener('click', function() {
    document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
    this.classList.add('active');
    renderPaymentsTable('all');
  });
  activeMonths.forEach(m => {
    const btn = document.getElementById('pill-' + m);
    if (btn) btn.addEventListener('click', function() {
      document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
      this.classList.add('active');
      renderPaymentsTable(m);
    });
  });
}

// ──────────────────────────────────────────────────────────
// RENDER EXPENSES
// ──────────────────────────────────────────────────────────
function renderExpenses() {
  const totalIn  = expenses.filter(e=>e.amount>0).reduce((s,e)=>s+e.amount,0);
  const totalOut = expenses.filter(e=>e.amount<0).reduce((s,e)=>s+Math.abs(e.amount),0);
  const balance  = expenses.reduce((s,e)=>s+e.amount,0);

  document.getElementById('expense-cards').innerHTML = `
    <div class="card">
      <div class="card-label">إجمالي الوارد (عزبة)</div>
      <div class="card-value green">${totalIn.toLocaleString('ar')} ر.س</div>
    </div>
    <div class="card">
      <div class="card-label">إجمالي الصادر (مصروفات)</div>
      <div class="card-value red">${totalOut.toLocaleString('ar',{minimumFractionDigits:2})} ر.س</div>
    </div>
    <div class="card">
      <div class="card-label">الرصيد الحالي</div>
      <div class="card-value gold">${balance.toLocaleString('ar',{minimumFractionDigits:2})} ر.س</div>
    </div>
  `;

  // Monthly collections summary
  const collByMonth = {};
  for (const ms of MONTH_ORDER) {
    const collected = payments.filter(p=>p.month===ms&&p.paid).reduce((s,p)=>s+p.amount,0);
    if (collected > 0) collByMonth[MONTH_MAP[ms]] = collected;
  }

  document.getElementById('month-summary-grid').innerHTML = Object.entries(collByMonth)
    .map(([mo, collected]) => `
      <div class="month-summary-card">
        <h4>${mo}</h4>
        <div class="ms-amount">${collected} ر.س</div>
        <div class="ms-meta">محصّل من الأعضاء</div>
      </div>
    `).join('');

  // Expenses table with running balance
  let running = 0;
  const tbody = document.getElementById('expenses-tbody');
  tbody.innerHTML = expenses.map(e => {
    running += e.amount;
    const isIn = e.amount > 0;
    const typeLabel = isIn
      ? '<span class="badge paid">وارد</span>'
      : '<span class="badge unpaid">مصروف</span>';
    const amtStr = isIn
      ? `<span class="amount-in">+${e.amount.toLocaleString('ar',{minimumFractionDigits:2})}</span>`
      : `<span class="amount-out">${e.amount.toLocaleString('ar',{minimumFractionDigits:2})}</span>`;
    return `<tr class="expense-row">
      <td>${e.desc}</td>
      <td>${typeLabel}</td>
      <td>${amtStr}</td>
      <td><span class="running-balance">${running.toLocaleString('ar',{minimumFractionDigits:2})} ر.س</span></td>
    </tr>`;
  }).join('');
}

// ──────────────────────────────────────────────────────────
// INIT UI (called after data is loaded)
// ──────────────────────────────────────────────────────────
function initUI() {
  renderHeaderBalance();
  renderSummaryCards();
  renderMemberSelect();
  renderMonthPills();
  renderPaymentsTable('all');
  renderExpenses();
}

// ──────────────────────────────────────────────────────────
// BOOT
// ──────────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
